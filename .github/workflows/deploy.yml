# Build here, ship the result, restart there.
#
# The VPS never needs a toolchain or a package registry: the app is a folder of
# static files and the server has no dependencies at all, so a deploy is two
# rsyncs and a restart. That also means a broken npm registry can never take the
# running app down — only prevent a new one from being built.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Empty means same origin, which is the recommended deployment. Set the
          # repository variable only if you run your own Open-Meteo instance.
          VITE_WEATHER_BASE_URL: ${{ vars.VITE_WEATHER_BASE_URL }}
        run: npm run build

      - name: Configure SSH
        env:
          # Base64, deliberately. A PEM private key pasted into a secret field is
          # the single most common way this pipeline breaks: one lost newline or
          # a stray leading space and OpenSSL rejects the whole thing with
          # "error in libcrypto", four steps later, inside an rsync failure.
          # One base64 line has nothing to mangle.
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY_B64" ]; then
            printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_deploy
          elif [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          else
            echo "::error::Set SSH_PRIVATE_KEY_B64 (preferred) or SSH_PRIVATE_KEY."
            exit 1
          fi
          chmod 600 ~/.ssh/id_deploy
          # Fail here, saying what to fix, rather than three steps later as an
          # "error in libcrypto" buried inside an rsync failure.
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::The private key did not parse. A PEM key pasted into a secret field loses newlines easily — set SSH_PRIVATE_KEY_B64 to the output of: base64 -w0 <keyfile>"
            exit 1
          fi
          echo "Deploy key loaded: $(ssh-keygen -l -f ~/.ssh/id_deploy | awk '{print $2, $4}')"
          # Pinned host key, not trust-on-first-use: a deploy must fail rather
          # than hand the key to whoever answers on that address.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          # Accepted from either namespace. Whether a value counts as a "secret"
          # or a "variable" is a GitHub distinction, not a property of the value,
          # and putting it in the wrong tab should not silently break a deploy.
          PORT: ${{ vars.SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          SSH="ssh -p $PORT -i ~/.ssh/id_deploy -o IdentitiesOnly=yes"
          # The built app replaces the old one wholesale; stale hashed assets
          # would otherwise pile up forever.
          rsync -az --delete -e "$SSH" dist/ "$TARGET:/srv/rjadom/app/dist/"
          # The server is a single file with no dependencies.
          rsync -az -e "$SSH" server/index.mjs "$TARGET:/srv/rjadom/app/server/index.mjs"

      - name: Restart
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          PORT: ${{ vars.SSH_PORT || secrets.SSH_PORT || '22' }}
          # Container by default. Set RESTART_COMMAND to
          # 'sudo /usr/bin/systemctl restart rjadom' for a plain systemd host.
          RESTART: ${{ vars.RESTART_COMMAND || secrets.RESTART_COMMAND || 'sudo /usr/bin/docker restart rjadom' }}
        run: |
          ssh -p "$PORT" -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "$TARGET" "$RESTART"

      - name: Health check
        env:
          DOMAIN: ${{ vars.DOMAIN || secrets.DOMAIN }}
        run: |
          # Deliberately fatal. A green run that checked nothing is worse than a
          # red one: it says "deployed and working" on the strength of an rsync.
          if [ -z "$DOMAIN" ]; then
            echo "::error::Repository variable DOMAIN is not set, so this deploy cannot verify itself. Set it to the hostname the app is served on."
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            sleep 3
            shell=$(curl -fsS -o /dev/null -w '%{http_code}' "https://$DOMAIN/" || true)
            # No credentials must be turned away. This proves the API is alive
            # *and* that the lock is on, without putting the secret in CI.
            api=$(curl -sS -o /dev/null -w '%{http_code}' "https://$DOMAIN/api/session" || true)
            echo "attempt $attempt: shell=$shell api=$api"
            if [ "$shell" = "200" ] && [ "$api" = "401" ]; then
              echo "Deployed and locked."
              exit 0
            fi
          done
          echo "Health check failed: expected shell 200 and api 401." >&2
          exit 1
