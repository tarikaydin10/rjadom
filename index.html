<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Locked like an application, not a page: no pinch zoom, no double-tap zoom,
         and the keyboard resizes the content instead of shoving the whole view up. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#241F1B" />
    <!-- A private page for two. It should not turn up in a search result. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Rjadom</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
