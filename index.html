<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Locked like an application, not a page: no pinch zoom, no double-tap zoom,
         and drawn out into the corners the phone keeps for itself.

         No interactive-widget=resizes-content. It asked the keyboard to shrink
         the layout viewport, and iOS does not reliably give that height back
         when the keyboard goes: the shell stayed short for the rest of the
         session and sat that far above the bottom edge, tab bar and all. The
         default, resizes-visual, leaves the layout alone and pans over it.

         shrink-to-fit=no: never zoom the page out to fit an element that lays
         out wider than the screen (the time rail's strip does, on purpose). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#241F1B" />
    <!-- A private page for two. It should not turn up in a search result. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Ryadom</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
